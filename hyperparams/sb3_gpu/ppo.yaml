n_timesteps: 100000000
policy: "MultiInputPolicy"
batch_size: 1200
clip_range: 0.2
ent_coef: 0.005
gae_lambda: 0.9
gamma: 0.997
learning_rate: lin_0.0001
max_grad_norm: 0.5
n_epochs: 16
n_steps: 1200
normalize: true
sde_sample_freq: 4
vf_coef: 0.5
policy_kwargs: "dict(
    log_std_init=-2,
    net_arch=[384, 384],
    )"
# SRB sb3_gpu settings.
policy_device: "auto"

# Online eval/video settings.
eval_every_episodes: 100
eval_n_episodes: 1
eval_video: true
eval_video_timesteps: 1200
eval_video_num_envs: 1
eval_video_prefix: "eval"
concat_eval_videos: true
